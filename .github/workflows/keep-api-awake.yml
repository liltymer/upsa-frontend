# Render's free plan puts the API to sleep after 15 minutes without requests,
# and the next visitor waits about 50 seconds for it to wake. A light request
# every 10 minutes keeps it awake. GitHub may delay scheduled runs a little.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://gradeiq-api.onrender.com/health
